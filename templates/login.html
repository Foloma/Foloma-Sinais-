<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foloma Visão 360 – Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 32px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 { color: #fbbf24; text-align: center; margin-bottom: 30px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            padding: 12px;
            border-radius: 30px;
            color: white;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; }
        .links a { color: #fbbf24; text-decoration: none; }

        /* Flash messages */
        .flash {
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 8px;
            color: #f1f5f9;
            font-size: 14px;
        }
        .flash-error { background: rgba(239,68,68,0.2); border-left: 4px solid #ef4444; }
        .flash-success { background: rgba(34,197,94,0.2); border-left: 4px solid #22c55e; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🔐 Foloma Visão 360</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" onsubmit="return handleSubmit();">
            <input type="text" name="username" placeholder="Utilizador" required
                   value="{{ request.form.get('username', '') }}" autocomplete="off">
            <input type="password" name="password" placeholder="Palavra-passe" required>
            <button type="submit" id="loginBtn">Entrar</button>
        </form>

        <div class="links">
            <a href="{{ url_for('afiliado') }}">Ainda não tem conta? Registe-se</a>
        </div>
    </div>

    <script>
        function handleSubmit() {
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = '⏳ A entrar...';

            // Fallback: reativar após 5 segundos se ainda estiver na página (erro de rede)
            setTimeout(function() {
                if (btn.disabled) {
                    btn.disabled = false;
                    btn.textContent = 'Entrar';
                }
            }, 5000);
            return true;
        }
    </script>
</body>
</html>
